<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.R Fashion | Official Links</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts: Playfair Display (for refined headings) & Poppins (for clean UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            red: '#DC2626',
                            dark: '#B91C1C',
                            blush: '#FEF2F2',
                            cream: '#FFFDFD',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Subtle floating animation for the logo badge */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-gentle-float {
            animation: gentleFloat 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="font-sans bg-gradient-to-b from-[#FFFDFD] via-[#FFF7F7] to-[#FEF2F2] min-h-screen text-neutral-800 antialiased flex items-center justify-center px-4 py-10 selection:bg-red-600 selection:text-white">

    <!-- Main Mobile-First Bio Link Card Container -->
    <main class="w-full max-w-md mx-auto bg-white/85 backdrop-blur-md rounded-3xl shadow-[0_12px_40px_rgba(220,38,38,0.08)] border border-red-100/80 px-6 py-9 sm:px-8 flex flex-col items-center">

        <!-- 1. Circular Logo Area -->
        <div class="relative mb-5 animate-gentle-float">
            <!-- Soft red glow behind the logo circle -->
            <div class="absolute -inset-1 bg-gradient-to-tr from-red-600 to-rose-400 rounded-full blur-md opacity-20"></div>
            
            <!-- Perfectly Round Logo Container -->
            <div class="relative w-28 h-28 rounded-full bg-white border-[3px] border-red-600 shadow-lg overflow-hidden flex items-center justify-center p-1.5">
                <!-- Replace the src URL below with your A.R Fashion logo link or file path -->
                <img 
                    id="brand-logo"
                    src="logo.jpg" 
                    alt="A.R Fashion Logo" 
                    class="w-full h-full object-contain rounded-full"
                    onerror="this.style.display='none'; document.getElementById('logo-fallback').classList.remove('hidden');"
                >
                <!-- Neat Monogram Fallback ('A.R') displayed if no image is loaded yet -->
                <div id="logo-fallback" class="hidden w-full h-full rounded-full bg-gradient-to-br from-red-50 to-white flex flex-col items-center justify-center text-center select-none">
                    <span class="font-serif text-3xl font-extrabold tracking-wider text-red-600 leading-none">A.R</span>
                    <span class="text-[9px] font-semibold tracking-[0.22em] text-neutral-500 uppercase mt-1">Fashion</span>
                </div>
            </div>
        </div>

        <!-- 2. Business Name & Accent Divider -->
        <div class="text-center mb-8">
            <h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight text-neutral-900">
                A.R Fashion
            </h1>
            <!-- Decorative Red Accent Divider -->
            <div class="flex items-center justify-center gap-2 mt-3">
                <span class="h-[2px] w-8 bg-red-200 rounded-full"></span>
                <span class="h-2 w-2 rounded-full bg-red-600"></span>
                <span class="h-[2px] w-8 bg-red-200 rounded-full"></span>
            </div>
        </div>

        <!-- 3. Interactive Action Buttons -->
        <div class="w-full flex flex-col gap-3.5">

            <!-- Facebook Page Button -->
            <a 
                href="https://www.facebook.com/profile.php?id=61559228646068" 
                target="_blank" 
                rel="noopener noreferrer"
                class="group w-full flex items-center justify-between px-4 py-3.5 rounded-xl bg-white border-2 border-red-600 text-neutral-900 shadow-sm transition-all duration-300 ease-out hover:bg-[#DC2626] hover:text-white hover:shadow-md hover:-translate-y-1 active:bg-[#B91C1C] active:text-white active:translate-y-0"
            >
                <div class="flex items-center gap-3.5">
                    <!-- Facebook SVG Icon -->
                    <span class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center transition-colors duration-300 group-hover:bg-white/20 group-hover:text-white">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </span>
                    <div class="flex flex-col text-left">
                        <span class="font-semibold text-[15px] leading-snug">Visit Facebook Page</span>
                        <span class="text-xs text-neutral-500 transition-colors duration-300 group-hover:text-red-100">Latest collections & updates</span>
                    </div>
                </div>
                <!-- Subtle Arrow Icon -->
                <svg class="w-4 h-4 text-red-600 transition-all duration-300 group-hover:text-white group-hover:translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <!-- Phone Call Button 1 -->
            <a 
                href="tel:+8801676280564"
                class="group w-full flex items-center justify-between px-4 py-3.5 rounded-xl bg-white border-2 border-red-600 text-neutral-900 shadow-sm transition-all duration-300 ease-out hover:bg-[#DC2626] hover:text-white hover:shadow-md hover:-translate-y-1 active:bg-[#B91C1C] active:text-white active:translate-y-0"
            >
                <div class="flex items-center gap-3.5">
                    <!-- Phone SVG Icon -->
                    <span class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center transition-colors duration-300 group-hover:bg-white/20 group-hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </span>
                    <div class="flex flex-col text-left">
                        <span class="font-semibold text-[15px] tracking-wide leading-snug">01676-280 564</span>
                        <span class="text-xs text-neutral-500 transition-colors duration-300 group-hover:text-red-100">Primary Contact</span>
                    </div>
                </div>
                <!-- Call Now Badge -->
                <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-red-50 text-red-600 transition-colors duration-300 group-hover:bg-white group-hover:text-red-600">
                    Call Now
                </span>
            </a>

            <!-- Phone Call Button 2 -->
            <a 
                href="tel:+8801676724301"
                class="group w-full flex items-center justify-between px-4 py-3.5 rounded-xl bg-white border-2 border-red-600 text-neutral-900 shadow-sm transition-all duration-300 ease-out hover:bg-[#DC2626] hover:text-white hover:shadow-md hover:-translate-y-1 active:bg-[#B91C1C] active:text-white active:translate-y-0"
            >
                <div class="flex items-center gap-3.5">
                    <!-- Phone SVG Icon -->
                    <span class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center transition-colors duration-300 group-hover:bg-white/20 group-hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </span>
                    <div class="flex flex-col text-left">
                        <span class="font-semibold text-[15px] tracking-wide leading-snug">01676-724 301</span>
                        <span class="text-xs text-neutral-500 transition-colors duration-300 group-hover:text-red-100">Alternative Contact</span>
                    </div>
                </div>
                <!-- Call Now Badge -->
                <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-red-50 text-red-600 transition-colors duration-300 group-hover:bg-white group-hover:text-red-600">
                    Call Now
                </span>
            </a>

        </div>

        <!-- 4. Store Address Card -->
        <section class="w-full mt-7 p-5 rounded-2xl bg-red-50/70 border border-red-100 text-center">
            <div class="inline-flex items-center justify-center gap-2 mb-2">
                <!-- Location Pin SVG Icon -->
                <svg class="w-5 h-5 text-red-600 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                </svg>
                <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-900">Our Store</h2>
            </div>

            <p class="text-sm text-neutral-700 leading-relaxed px-1">
                Stall no: 1098, Monu Mollah Shopping Complex, Saruila, Demra, Dhaka
            </p>

            <!-- Clickable Google Maps Link -->
            <a 
                href="https://www.google.com/maps/search/?api=1&query=Monu+Mollah+Shopping+Complex,+Saruila,+Demra,+Dhaka" 
                target="_blank" 
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 mt-3.5 text-xs font-semibold text-red-600 hover:text-red-800 underline underline-offset-4 transition-colors"
            >
                <span>View on Google Maps</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </a>
        </section>

        <!-- 5. Minimal Footer -->
        <footer class="mt-8 pt-2 text-center">
            <p class="text-xs text-neutral-400 font-medium tracking-wide">
                &copy; 2026 A.R Fashion
            </p>
        </footer>

    </main>

</body>
</html>
